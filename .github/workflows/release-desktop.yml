name: Release (SemVer + macOS DMG)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Compute next semantic version from commits
        id: ver
        run: node scripts/next-version.mjs --github-output "$GITHUB_OUTPUT" --notes-file release-notes.md

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Run desktop unit tests
        working-directory: desktop
        run: go test -v ./...

      - name: Build universal macOS DMG
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          UPDATE_REPO: ${{ github.repository }}
          UNIVERSAL: "1"
        run: bash scripts/package-desktop-dmg.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              desktop/build/release/HelpingHand-macOS-universal.dmg \
              desktop/build/release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              desktop/build/release/HelpingHand-macOS-universal.dmg \
              desktop/build/release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Band of the Helping Hand ${TAG}" \
              --notes-file release-notes.md
          fi
