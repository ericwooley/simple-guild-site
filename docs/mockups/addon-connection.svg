<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Helping Hand addon connection concept</title>
  <desc id="desc">A static concept with a dark window, three tabs, a token field, and sync status rows. The addon is not connected.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.4"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; font-size: 15px; fill: #f1f2f3; }
      .muted { fill: #adb2bc; }
      .small { font-size: 13px; }
      .heading { font-size: 19px; font-weight: 600; }
      .line { stroke: #343a45; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1000" height="680" fill="#12151c"/>
  <g filter="url(#shadow)">
    <rect x="90" y="48" width="820" height="584" rx="6" fill="#181b21" stroke="#626975"/>
  </g>
  <path d="M96 48 H904 Q910 48 910 54 V108 H90 V54 Q90 48 96 48" fill="#20242c"/>
  <text x="118" y="85" class="heading">Helping Hand</text>
  <rect x="850" y="59" width="44" height="38" rx="3" fill="#292e37" stroke="#424957"/>
  <path d="m867 73 10 10 m0-10-10 10" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="90" y1="108" x2="910" y2="108" class="line"/>
  <rect x="114" y="124" width="152" height="42" rx="3" fill="#323844" stroke="#8e98a9"/>
  <text x="150" y="151">Connection</text>
  <rect x="274" y="124" width="152" height="42" rx="3" fill="#1b1f26" stroke="#3b424e"/>
  <text x="309" y="151" class="muted">Characters</text>
  <rect x="434" y="124" width="120" height="42" rx="3" fill="#1b1f26" stroke="#3b424e"/>
  <text x="476" y="151" class="muted">Guild</text>
  <circle cx="745" cy="145" r="4" fill="#d4a965"/>
  <text x="758" y="151" class="small" fill="#d4a965">Not connected</text>

  <rect x="114" y="190" width="772" height="176" rx="3" fill="#101318" stroke="#3b424e"/>
  <text x="134" y="222" class="heading">Sync token</text>
  <text x="134" y="253" class="small muted">Token</text>
  <rect x="134" y="264" width="594" height="44" rx="3" fill="#1b1f26" stroke="#5d6878"/>
  <text x="150" y="291" class="muted">Paste sync token</text>
  <rect x="744" y="264" width="122" height="44" rx="3" fill="#38465a" stroke="#8293aa"/>
  <text x="766" y="291">Save token</text>
  <text x="134" y="340" class="small muted">Get a token from Addon Sync in your website account.</text>

  <rect x="114" y="382" width="772" height="178" rx="3" fill="#101318" stroke="#3b424e"/>
  <text x="134" y="415" class="heading">Sync status</text>
  <text x="134" y="454">Characters</text>
  <text x="758" y="454" class="small muted">Not synced</text>
  <line x1="134" y1="469" x2="866" y2="469" class="line"/>
  <text x="134" y="494">Professions</text>
  <text x="758" y="494" class="small muted">Not synced</text>
  <line x1="134" y1="509" x2="866" y2="509" class="line"/>
  <text x="134" y="534">Guild data</text>
  <text x="758" y="534" class="small muted">Not synced</text>

  <text x="114" y="600" class="small muted">Last sync</text>
  <text x="186" y="600" class="small">Never</text>
  <rect x="730" y="576" width="156" height="38" rx="3" fill="#242932" stroke="#3d4653"/>
  <text x="761" y="600" class="muted">Clear token</text>
</svg>
